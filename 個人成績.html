<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>個人成績</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');
  :root { --bg-deep:#0a0e1a; --bg-card:#131a2c; --border:#262f47; --border-bright:#3a4568; --white:#eef1f8; --white-dim:#8b93b0; --white-muted:#545d7c; --cyan:#4cc9f0; --cyan-dim:#2f97b8; --cyan-glow:rgba(76,201,240,0.28); --gold:#ffd166; --danger:#ef4444; --success:#2dd4a7; --radius:16px; --radius-sm:12px; --radius-xs:8px; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Zen Kaku Gothic New','Noto Sans JP',-apple-system,sans-serif; background:var(--bg-deep); color:var(--white); min-height:100dvh; -webkit-font-smoothing:antialiased; }
  body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 700px 500px at 15% -5%, rgba(76,201,240,0.08), transparent), radial-gradient(ellipse 600px 500px at 90% 100%, rgba(255,209,102,0.05), transparent); pointer-events:none; z-index:0; }
  .app-header { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:center; gap:8px; padding:14px 16px; background:rgba(10,14,26,0.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--border); }
  .app-header h1 { font-size:15px; font-weight:900; letter-spacing:3px; }
  .app-header h1::before { content:'● '; color:var(--danger); font-size:10px; vertical-align:middle; }
  .app-header .gear { position:absolute; right:14px; font-size:18px; cursor:pointer; color:var(--white-muted); background:none; border:none; }
  .wrap { position:relative; z-index:1; max-width:560px; margin:0 auto; padding:14px 12px 40px; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:0 10px 30px rgba(0,0,0,0.45); }
  .card-title { font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; color:var(--cyan); text-transform:uppercase; letter-spacing:3px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .form-label { font-size:11px; font-weight:700; color:var(--white-dim); margin-bottom:4px; display:block; }
  .form-input, .form-select { width:100%; padding:11px 12px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:var(--radius-xs); color:var(--white); font-size:14px; margin-bottom:10px; }
  .form-input:focus, .form-select:focus { outline:none; border-color:var(--cyan); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:12px 18px; border:none; border-radius:100px; font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700; cursor:pointer; background:linear-gradient(135deg,var(--cyan),#2f97b8); color:#031018; box-shadow:0 6px 18px var(--cyan-glow); }
  .btn:active { transform:scale(0.97); }
  .msg { font-size:12px; padding:9px 12px; border-radius:var(--radius-xs); margin-bottom:10px; display:none; }
  .msg.info { display:block; background:rgba(76,201,240,0.1); color:var(--cyan); }
  .msg.error { display:block; background:rgba(239,68,68,0.1); color:var(--danger); }
  .msg.success { display:block; background:rgba(45,212,167,0.1); color:var(--success); }
  .top-tabs { display:flex; gap:4px; padding:4px; margin-bottom:10px; background:var(--bg-card); border:1px solid var(--border); border-radius:100px; }
  .top-tab { flex:1; border:none; border-radius:100px; padding:10px 0; background:transparent; color:var(--white-muted); font-size:12px; font-weight:800; cursor:pointer; }
  .top-tab.active { background:var(--cyan); color:#031018; }
  .toolbar { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .toolbar .wide { grid-column:1 / -1; }
  .search-box input { width:100%; padding:11px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:100px; color:var(--white); font-size:14px; }
  .qual-row { display:flex; align-items:center; gap:8px; margin:2px 0 10px; color:var(--white-dim); font-size:12px; }
  .qual-row input[type="checkbox"] { width:18px; height:18px; accent-color:var(--cyan); }
  .rule-note { color:var(--white-muted); font-size:11px; line-height:1.5; margin:-2px 0 10px; }
  .player-list { display:flex; flex-direction:column; gap:6px; }
  .player-item { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; transition:all 0.15s; }
  .player-item:active { transform:scale(0.98); border-color:var(--cyan-dim); }
  .rank { width:24px; font-family:'Oswald',sans-serif; font-size:14px; color:var(--white-muted); text-align:center; flex-shrink:0; }
  .pname { flex:1; min-width:0; font-weight:700; font-size:14px; }
  .pname-main { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pnick, .subline { font-size:11px; color:var(--white-muted); margin-top:2px; }
  .pnick { color:var(--gold); font-style:italic; }
  .stat-main { font-family:'Oswald',sans-serif; font-size:18px; font-weight:600; color:var(--cyan); font-variant-numeric:tabular-nums; text-align:right; min-width:58px; }
  .stat-main.gold { color:var(--gold); }
  .badge { display:inline-flex; padding:2px 7px; border-radius:100px; font-size:10px; font-weight:800; margin-top:4px; }
  .badge.ok { background:rgba(45,212,167,0.12); color:var(--success); }
  .badge.no { background:rgba(255,209,102,0.12); color:var(--gold); }
  .empty-note { text-align:center; color:var(--white-muted); font-size:13px; padding:30px 10px; }
  .back-btn { display:inline-flex; align-items:center; gap:4px; color:var(--cyan); font-size:13px; font-weight:700; margin-bottom:12px; cursor:pointer; background:none; border:none; font-family:'Zen Kaku Gothic New',sans-serif; }
  .player-hero { text-align:center; padding:10px 0 4px; }
  .player-hero .label { font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:4px; color:var(--white-muted); text-transform:uppercase; }
  .player-hero h2 { font-size:26px; font-weight:900; margin-top:4px; }
  .player-hero .nick { color:var(--gold); font-style:italic; font-size:13px; margin-top:2px; }
  .avg-display { text-align:center; margin:18px 0 8px; }
  .avg-display .num { font-family:'Oswald',sans-serif; font-size:56px; font-weight:600; color:var(--cyan); text-shadow:0 0 24px var(--cyan-glow); line-height:1; font-variant-numeric:tabular-nums; }
  .avg-display .cap { font-family:'Oswald',sans-serif; font-size:11px; color:var(--white-muted); letter-spacing:3px; text-transform:uppercase; margin-top:6px; }
  .key-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:16px 0; }
  .key-stat { text-align:center; padding:12px 4px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:var(--radius-xs); }
  .key-stat .v { font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; color:var(--white); font-variant-numeric:tabular-nums; }
  .key-stat .l { font-size:10px; color:var(--white-muted); margin-top:3px; }
  .key-stat.hr .v { color:var(--gold); }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:rgba(255,255,255,0.02); border:1px solid var(--border); border-radius:var(--radius-xs); }
  .stat-row .l { font-size:12px; color:var(--white-dim); }
  .stat-row .v { font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; color:var(--white); font-variant-numeric:tabular-nums; }
  .player-photo { display:inline-flex; align-items:center; justify-content:center; overflow:hidden; border-radius:50%; background:rgba(76,201,240,0.15); color:var(--cyan); font-family:'Oswald',sans-serif; font-weight:700; flex-shrink:0; }
  .player-photo.list { width:42px; height:42px; font-size:15px; }
  .player-photo.detail { width:96px; height:96px; font-size:34px; margin:0 auto 12px; border:1px solid rgba(76,201,240,0.35); box-shadow:0 0 24px var(--cyan-glow); }
  .player-photo img { width:100%; height:100%; object-fit:cover; display:block; }
  #screenList, #screenDetail { display:none; }
  #screenList.active, #screenDetail.active { display:block; }

<body>
<div class="app-header"><h1>個人成績</h1><button class="gear" onclick="toggleSettings()" title="設定">⚙</button></div>
<div class="wrap">
  <div class="card" id="settingsCard" style="display:none;">
    <div class="card-title">スプレッドシート連携設定</div>
    <label class="form-label">Google Apps Script のURL</label>
    <input class="form-input" id="urlInput" placeholder="https://script.google.com/macros/s/..." />
    <button class="btn" onclick="loadData()">読み込む</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="screenList" class="active">
    <div class="top-tabs">
      <button class="top-tab active" id="tabBat" onclick="setMode('bat')">打者</button>
      <button class="top-tab" id="tabPitch" onclick="setMode('pitch')">投手</button>
    </div>
    <div class="card">
      <div class="toolbar">
        <div class="wide search-box"><input id="searchInput" placeholder="選手名で検索" oninput="renderList()" /></div>
        <div><label class="form-label">並び順</label><select class="form-select" id="sortSelect" onchange="renderList()"></select></div>
        <div><label class="form-label" id="qualLabel">規定打席</label><input class="form-input" id="qualRate" value="自動" disabled /></div>
      </div>
      <label class="qual-row"><input type="checkbox" id="qualifiedOnly" onchange="renderList()" /> 規定到達だけ表示</label>
      <div class="rule-note" id="ruleNote"></div>
    </div>
    <div class="player-list" id="playerList"></div>
  </div>

  <div id="screenDetail">
    <button class="back-btn" onclick="showList()">← 一覧へ戻る</button>
    <div class="card">
      <div class="player-hero">
        <div class="player-photo detail" id="dPhoto">?</div>
        <div class="label" id="dType">Player</div>
        <h2 id="dName">-</h2>
        <div class="nick" id="dNick"></div>
      </div>
      <div class="avg-display">
        <div class="num" id="dMain">.---</div>
        <div class="cap" id="dMainCap">打率 AVG</div>
      </div>
      <div class="key-stats" id="dKeys"></div>
    </div>
    <div class="card">
      <div class="card-title">詳細成績</div>
      <div class="stat-grid" id="dGrid"></div>
    </div>
  </div>
</div>

<script>
let allStats = {};
let allPitchers = {};
let currentMode = 'bat';

const batSorts = [
  ['avg','打率'], ['obp','出塁率'], ['hits','安打'], ['hrs','本塁打'], ['rbi','打点'], ['pa','打席'], ['games','試合数'], ['ksAsc','三振 少ない順']
];
const pitchSorts = [
  ['era','防御率'], ['kip','奪三振率'], ['ip','投球回'], ['ks','奪三振'], ['runsAsc','失点 少ない順'], ['games','登板数']
];

function getUrl() { return localStorage.getItem('gasUrl') || ''; }
function saveUrl(u) { if (u) localStorage.setItem('gasUrl', u); }
function toggleSettings() { const el = document.getElementById('settingsCard'); el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
function showMsg(text, type) { const el = document.getElementById('msg'); if (!text) { el.className = 'msg'; el.textContent = ''; return; } el.className = 'msg ' + type; el.textContent = text; }

window.addEventListener('load', () => {
  document.getElementById('urlInput').value = getUrl();
  fillSortOptions();
  if (getUrl()) loadData(); else toggleSettings();
});

async function loadData() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showMsg('URLを入力してください', 'error'); return; }
  saveUrl(url);
  showMsg('読み込み中...', 'info');
  try {
    const res = await fetch(`${url}?action=load`);
    const json = await res.json();
    if (json.status !== 'ok') { showMsg('読み込み失敗：' + (json.message || 'エラー'), 'error'); return; }
    allStats = json.stats || {};
    allPitchers = json.pitchers || {};
    const n = Object.keys(allStats).length;
    const pn = Object.keys(allPitchers).length;
    showMsg(`✅ 打者${n}人・投手${pn}人を読み込みました`, 'success');
    document.getElementById('settingsCard').style.display = 'none';
    renderList();
  } catch (err) { showMsg('読み込み失敗：' + err.message, 'error'); }
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('tabBat').classList.toggle('active', mode === 'bat');
  document.getElementById('tabPitch').classList.toggle('active', mode === 'pitch');
  document.getElementById('qualLabel').textContent = mode === 'bat' ? '規定打席' : '投手規定';
  document.getElementById('qualRate').value = mode === 'bat' ? '自動' : 'なし';
  document.getElementById('qualRate').disabled = true;
  fillSortOptions();
  renderList();
}
function fillSortOptions() {
  const select = document.getElementById('sortSelect');
  const list = currentMode === 'bat' ? batSorts : pitchSorts;
  select.innerHTML = list.map(([v, label]) => `<option value="${v}">${label}</option>`).join('');
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function calcAvg(hits, ab) { if (!num(ab)) return '.---'; return '.' + String(Math.round((num(hits) / num(ab)) * 1000)).padStart(3, '0'); }
function calcObp(hits, walks, pa) { if (!num(pa)) return '.---'; return '.' + String(Math.round(((num(hits) + num(walks)) / num(pa)) * 1000)).padStart(3, '0'); }
function calcEra(er, ip) { if (!num(ip)) return '---'; return ((num(er) * 3) / num(ip)).toFixed(2); }
function calcKip(ks, ip) { if (!num(ip)) return '---'; return ((num(ks) * 3) / num(ip)).toFixed(2); }
function initials(name) { const clean = String(name || '?').trim(); return clean ? clean.slice(0, 1).toUpperCase() : '?'; }
function normalizePhotoUrl(url) {
  const raw = String(url || '').trim();
  if (!raw) return '';
  const driveMatch = raw.match(/drive\.google\.com\/file\/d\/([^/]+)/) || raw.match(/[?&]id=([^&]+)/);
  if (driveMatch) return `https://drive.google.com/thumbnail?id=${driveMatch[1]}&sz=w400`;
  return raw;
}
function photoHtml(s, name, className) { const photo = normalizePhotoUrl(s && s.photo); if (photo) return `<span class="player-photo ${className}"><img src="${escapeHtml(photo)}" alt="${escapeHtml(name)}"></span>`; return `<span class="player-photo ${className}">${escapeHtml(initials(name))}</span>`; }
function seasonGames() { const vals = Object.values(allStats).map(s => num(s.games)); return Math.max(0, ...vals); }
function requiredBatPa() { return Math.max(1, Math.ceil(seasonGames() / 5)); }
function requiredPitchIp() { return 0; }
function qualifiedBat(s) { return num(s.pa) >= requiredBatPa(); }
function qualifiedPitch(p) { return true; }
function playerPhotoSource(name) { return allStats[name] || {}; }

function batValue(s, key) {
  if (key === 'avg') return num(s.ab) ? num(s.hits) / num(s.ab) : -1;
  if (key === 'obp') return num(s.pa) ? (num(s.hits) + num(s.walks)) / num(s.pa) : -1;
  if (key === 'ksAsc') return -num(s.ks);
  return num(s[key]);
}
function pitchValue(p, key) {
  if (key === 'era') return num(p.ip) ? -num(p.era || calcEra(p.er, p.ip)) : -9999;
  if (key === 'kip') return num(p.ip) ? num(p.kip || calcKip(p.ks, p.ip)) : -1;
  if (key === 'runsAsc') return -num(p.runs);
  return num(p[key]);
}

function renderList() {
  const wrap = document.getElementById('playerList');
  const q = (document.getElementById('searchInput').value || '').trim();
  const sortKey = document.getElementById('sortSelect').value;
  const only = document.getElementById('qualifiedOnly').checked;
  const games = seasonGames();
  if (currentMode === 'bat') renderBatters(wrap, q, sortKey, only, games);
  else renderPitchers(wrap, q, sortKey, only, games);
}

function renderBatters(wrap, q, sortKey, only, games) {
  const req = requiredBatPa();
  document.getElementById('ruleNote').textContent = `規定打席: ${games}試合 × ${num(document.getElementById('qualRate').value)} = ${req}打席。規定未満も表示できます。`;
  let names = Object.keys(allStats).filter(n => !q || n.includes(q));
  if (only) names = names.filter(n => qualifiedBat(allStats[n]));
  names.sort((a, b) => (qualifiedBat(allStats[b]) - qualifiedBat(allStats[a])) || (batValue(allStats[b], sortKey) - batValue(allStats[a], sortKey)) || a.localeCompare(b, 'ja'));
  if (!names.length) { wrap.innerHTML = '<div class="empty-note">選手が見つかりません</div>'; return; }
  wrap.innerHTML = names.map((name, i) => {
    const s = allStats[name]; const main = sortKey === 'obp' ? calcObp(s.hits, s.walks, s.pa) : sortKey === 'avg' ? calcAvg(s.hits, s.ab) : sortKey === 'ksAsc' ? num(s.ks) : num(s[sortKey]);
    return `<div class="player-item" onclick="showDetail('bat','${encodeURIComponent(name)}')"><div class="rank">${i + 1}</div>${photoHtml(s, name, 'list')}<div class="pname"><div class="pname-main">${escapeHtml(name)}</div>${s.nickname ? `<div class="pnick">${escapeHtml(s.nickname)}</div>` : ''}<div class="subline">${num(s.games)}試合 / ${num(s.pa)}打席</div><span class="badge ${qualifiedBat(s) ? 'ok' : 'no'}">${qualifiedBat(s) ? '規定到達' : `規定まで${Math.max(0, req - num(s.pa))}`}</span></div><div class="stat-main">${main}</div></div>`;
  }).join('');
}

function renderPitchers(wrap, q, sortKey, only, games) {
  const req = requiredPitchIp();
  document.getElementById('ruleNote').textContent = `規定投球回: ${games}試合 × ${num(document.getElementById('qualRate').value)} = ${req.toFixed(1)}回。3イニング制なので初期値は1回/試合にしています。`;
  let names = Object.keys(allPitchers).filter(n => !q || n.includes(q));
  if (only) names = names.filter(n => qualifiedPitch(allPitchers[n]));
  names.sort((a, b) => (qualifiedPitch(allPitchers[b]) - qualifiedPitch(allPitchers[a])) || (pitchValue(allPitchers[b], sortKey) - pitchValue(allPitchers[a], sortKey)) || a.localeCompare(b, 'ja'));
  if (!names.length) { wrap.innerHTML = '<div class="empty-note">投手成績が見つかりません</div>'; return; }
  wrap.innerHTML = names.map((name, i) => {
    const p = allPitchers[name]; const photoSrc = playerPhotoSource(name); const main = sortKey === 'era' ? (p.era || calcEra(p.er, p.ip)) : sortKey === 'kip' ? (p.kip || calcKip(p.ks, p.ip)) : sortKey === 'runsAsc' ? num(p.runs) : num(p[sortKey]);
    return `<div class="player-item" onclick="showDetail('pitch','${encodeURIComponent(name)}')"><div class="rank">${i + 1}</div>${photoHtml(photoSrc, name, 'list')}<div class="pname"><div class="pname-main">${escapeHtml(name)}</div><div class="subline">${num(p.games)}登板 / ${num(p.ip)}回 / ${num(p.ks)}K</div><span class="badge ${qualifiedPitch(p) ? 'ok' : 'no'}">${qualifiedPitch(p) ? '規定到達' : `規定まで${Math.max(0, req - num(p.ip)).toFixed(1)}回`}</span></div><div class="stat-main gold">${main}</div></div>`;
  }).join('');
}

function showList() { document.getElementById('screenList').classList.add('active'); document.getElementById('screenDetail').classList.remove('active'); }
function setDetailPhoto(s, name) { const el = document.getElementById('dPhoto'); const photo = normalizePhotoUrl(s && s.photo); if (photo) el.innerHTML = `<img src="${escapeHtml(photo)}" alt="${escapeHtml(name)}">`; else el.textContent = initials(name); }
function row(label, value) { return `<div class="stat-row"><span class="l">${label}</span><span class="v">${value}</span></div>`; }
function key(label, value, cls = '') { return `<div class="key-stat ${cls}"><div class="v">${value}</div><div class="l">${label}</div></div>`; }
function showDetail(type, encodedName) {
  const name = decodeURIComponent(encodedName);
  document.getElementById('screenList').classList.remove('active');
  document.getElementById('screenDetail').classList.add('active');
  document.getElementById('dName').textContent = name;
  window.scrollTo(0, 0);
  if (type === 'pitch') showPitchDetail(name); else showBatDetail(name);
}
function showBatDetail(name) {
  const s = allStats[name]; if (!s) return;
  setDetailPhoto(s, name);
  document.getElementById('dType').textContent = 'Batter';
  document.getElementById('dNick').textContent = s.nickname || '';
  document.getElementById('dMain').textContent = calcAvg(s.hits, s.ab);
  document.getElementById('dMainCap').textContent = '打率 AVG';
  document.getElementById('dKeys').innerHTML = key('試合数', num(s.games)) + key('本塁打', num(s.hrs), 'hr') + key('打点', num(s.rbi));
  document.getElementById('dGrid').innerHTML = row('打席 (PA)', num(s.pa)) + row('打数 (AB)', num(s.ab)) + row('安打 (H)', num(s.hits)) + row('出塁率 (OBP)', calcObp(s.hits, s.walks, s.pa)) + row('二塁打', num(s.doubles)) + row('三塁打', num(s.triples)) + row('四球 (BB)', num(s.walks)) + row('三振 (K)', num(s.ks)) + row('規定打席', qualifiedBat(s) ? '到達' : `${Math.max(0, requiredBatPa() - num(s.pa))}打席不足`);
}
function showPitchDetail(name) {
  const p = allPitchers[name]; if (!p) return;
  const photoSrc = playerPhotoSource(name);
  setDetailPhoto(photoSrc, name);
  document.getElementById('dType').textContent = 'Pitcher';
  document.getElementById('dNick').textContent = '';
  document.getElementById('dMain').textContent = p.era || calcEra(p.er, p.ip);
  document.getElementById('dMainCap').textContent = '防御率 ERA';
  document.getElementById('dKeys').innerHTML = key('登板', num(p.games)) + key('投球回', num(p.ip)) + key('奪三振', num(p.ks), 'hr');
  document.getElementById('dGrid').innerHTML = row('打者数 (BF)', num(p.bf)) + row('失点', num(p.runs)) + row('自責点', num(p.er)) + row('被安打', num(p.hits)) + row('三振', num(p.ks)) + row('四球', num(p.walks)) + row('奪三振率', p.kip || calcKip(p.ks, p.ip)) + row('規定投球回', qualifiedPitch(p) ? '到達' : `${Math.max(0, requiredPitchIp() - num(p.ip)).toFixed(1)}回不足`);
}
</script>
</body>
</html>
