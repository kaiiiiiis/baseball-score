<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>順位表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root {
    --bg-deep: #0a0e1a;
    --bg-card: #131a2c;
    --border: #262f47;
    --border-bright: #3a4568;
    --white: #eef1f8;
    --white-dim: #8b93b0;
    --white-muted: #545d7c;
    --cyan: #4cc9f0;
    --cyan-glow: rgba(76,201,240,0.28);
    --gold: #ffd166;
    --gold-glow: rgba(255,209,102,0.3);
    --danger: #ef4444;
    --success: #2dd4a7;
    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Zen Kaku Gothic New','Noto Sans JP',-apple-system,sans-serif;
    background:var(--bg-deep); color:var(--white); min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 700px 500px at 15% -5%, rgba(76,201,240,0.08), transparent),
      radial-gradient(ellipse 600px 500px at 90% 100%, rgba(255,209,102,0.05), transparent);
    pointer-events:none; z-index:0;
  }
  .app-header {
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 16px; background:rgba(10,14,26,0.92);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--border);
  }
  .app-header h1 { font-size:15px; font-weight:900; letter-spacing:3px; }
  .app-header h1::before { content:'● '; color:var(--danger); font-size:10px; vertical-align:middle; }
  .app-header .gear {
    position:absolute; right:14px; font-size:18px; cursor:pointer; color:var(--white-muted);
    background:none; border:none;
  }

  .wrap { position:relative; z-index:1; max-width:560px; margin:0 auto; padding:14px 12px 40px; }

  .card {
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:12px; box-shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  .card-title {
    font-family:'Oswald',sans-serif; font-size:12px; font-weight:600; color:var(--cyan);
    text-transform:uppercase; letter-spacing:3px; margin-bottom:14px; padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .form-label { font-size:11px; font-weight:700; color:var(--white-dim); margin-bottom:4px; display:block; }
  .form-input {
    width:100%; padding:11px 12px; background:rgba(255,255,255,0.04);
    border:1px solid var(--border); border-radius:var(--radius-xs);
    color:var(--white); font-size:14px; margin-bottom:10px;
  }
  .form-input:focus { outline:none; border-color:var(--cyan); }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    width:100%; padding:12px 18px; border:none; border-radius:100px;
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700;
    cursor:pointer; background:linear-gradient(135deg,var(--cyan),#2f97b8); color:#031018;
    box-shadow:0 6px 18px var(--cyan-glow);
  }
  .btn:active { transform:scale(0.97); }

  .msg { font-size:12px; padding:9px 12px; border-radius:var(--radius-xs); margin-bottom:10px; display:none; }
  .msg.info { display:block; background:rgba(76,201,240,0.1); color:var(--cyan); }
  .msg.error { display:block; background:rgba(239,68,68,0.1); color:var(--danger); }
  .msg.success { display:block; background:rgba(45,212,167,0.1); color:var(--success); }

  .standings-table { width:100%; border-collapse:collapse; font-size:13px; }
  .standings-table th {
    background:rgba(76,201,240,0.08); padding:9px 8px;
    font-family:'Oswald',sans-serif; font-size:10px; font-weight:600;
    color:var(--cyan); text-align:center; letter-spacing:1px;
    border-bottom:1px solid var(--border-bright);
  }
  .standings-table th.team-col, .standings-table td.team-col { text-align:left; }
  .standings-table td {
    padding:11px 8px; text-align:center;
    border-bottom:1px solid var(--border); color:var(--white-dim);
    font-family:'Oswald',sans-serif; font-weight:500; font-size:14px;
    font-variant-numeric:tabular-nums;
  }
  .standings-table td.team-col {
    font-family:'Zen Kaku Gothic New',sans-serif; font-size:13px; font-weight:700; color:var(--white);
  }
  .standings-table td.pct-col { color:var(--cyan); font-weight:700; font-size:15px; }
  .rank-badge {
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%;
    font-size:11px; font-weight:700; background:rgba(255,255,255,0.06); color:var(--white-dim);
  }
  .rank-badge.first { background:var(--gold); color:#031018; box-shadow:0 0 12px var(--gold-glow); }

  .games-log { display:flex; flex-direction:column; gap:6px; }
  .game-row {
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px; background:rgba(255,255,255,0.02);
    border:1px solid var(--border); border-radius:var(--radius-xs);
    font-size:12px;
  }
  .game-row .g-teams { color:var(--white-dim); }
  .game-row .g-teams b { color:var(--white); }
  .game-row .g-date { color:var(--white-muted); font-size:10px; font-family:'Oswald',sans-serif; }
  .empty-note { text-align:center; color:var(--white-muted); font-size:13px; padding:30px 10px; }
  .sim-settings { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .game-row { cursor:pointer; }
  .game-row.auto { opacity:0.82; }
  .game-row.auto .g-teams::after { content:' AUTO'; display:inline-flex; margin-left:6px; padding:1px 6px; border-radius:100px; background:#fff2cf; color:#8a6214; font-size:10px; font-weight:800; }
  .detail-panel { display:none; }
  .detail-panel.open { display:block; }
  .detail-score { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; margin-bottom:12px; }
  .detail-team { font-weight:900; font-size:15px; }
  .detail-total { font-family:'Oswald',sans-serif; font-size:34px; color:var(--cyan); }
  .detail-vs { color:var(--white-muted); font-family:'Oswald',sans-serif; }
  .mini-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
  .mini-table th, .mini-table td { padding:7px 8px; border-bottom:1px solid var(--border); text-align:center; }
  .mini-table th:first-child, .mini-table td:first-child { text-align:left; }
  .detail-log { display:flex; flex-direction:column; gap:5px; max-height:220px; overflow:auto; margin-top:8px; }
  .detail-log div { padding:7px 9px; border:1px solid var(--border); border-radius:var(--radius-xs); color:var(--white-dim); font-size:12px; }
  @media (max-width:500px) { .sim-settings { grid-template-columns:1fr; } }

<body>

<div class="app-header">
  <h1>順位表</h1>
  <button class="gear" onclick="toggleSettings()" title="設定">⚙</button>
</div>

<div class="wrap">

  <div class="card" id="settingsCard" style="display:none;">
    <div class="card-title">スプレッドシート連携設定</div>
    <label class="form-label">Google Apps Script のURL</label>
    <input class="form-input" id="urlInput" placeholder="https://script.google.com/macros/s/..." />
    <button class="btn" onclick="loadData()">読み込む</button>
    <div class="sim-settings">
      <div><label class="form-label">基準チーム</label><input class="form-input" id="baseTeamInput" value="WII" /></div>
      <div><label class="form-label">自動チーム</label><input class="form-input" id="simTeamsInput" value="AAA,BBB,CCC,DDD" /></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="card-title">🏆 順位表</div>
    <table class="standings-table" id="standingsTable" style="display:none;">
      <thead>
        <tr>
          <th></th><th class="team-col">チーム</th><th>試合</th><th>勝</th><th>負</th><th>分</th><th>勝率</th>
        </tr>
      </thead>
      <tbody id="standingsBody"></tbody>
    </table>
    <div class="empty-note" id="standingsEmpty">まだ試合結果がありません</div>
  </div>

  <div class="card">
    <div class="card-title">最近の試合結果</div>
    <div class="games-log" id="gamesLog"></div>
    <div class="empty-note" id="gamesEmpty" style="display:none;">記録された試合がありません</div>
  </div>

  <div class="card detail-panel" id="detailPanel">
    <div class="card-title">試合詳細</div>
    <div id="detailBody"></div>
  </div>

</div>

<script>
let currentGames = [];
function getUrl() { return localStorage.getItem('gasUrl') || ''; }
function saveUrl(u) { if (u) localStorage.setItem('gasUrl', u); }
function toggleSettings() { const el = document.getElementById('settingsCard'); el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
function showMsg(text, type) { const el = document.getElementById('msg'); if (!text) { el.className = 'msg'; el.textContent = ''; return; } el.className = 'msg ' + type; el.textContent = text; }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

window.addEventListener('load', () => {
  const saved = getUrl();
  document.getElementById('urlInput').value = saved;
  document.getElementById('baseTeamInput').value = localStorage.getItem('baseTeamName') || 'WII';
  document.getElementById('simTeamsInput').value = localStorage.getItem('simTeamNames') || 'AAA,BBB,CCC,DDD';
  if (saved) loadData(); else toggleSettings();
});

async function loadData() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { showMsg('URLを入力してください', 'error'); return; }
  saveUrl(url);
  localStorage.setItem('baseTeamName', document.getElementById('baseTeamInput').value.trim() || 'WII');
  localStorage.setItem('simTeamNames', document.getElementById('simTeamsInput').value.trim());
  showMsg('読み込み中...', 'info');
  try {
    const res = await fetch(`${url}?action=standings`);
    const json = await res.json();
    if (json.status !== 'ok') { showMsg('読み込み失敗：' + (json.message || 'エラー'), 'error'); return; }
    const merged = buildLeagueView(json.standings || [], json.games || []);
    currentGames = merged.games;
    renderStandings(merged.standings);
    renderGames(merged.games);
    if (merged.standings.length > 0) {
      showMsg(`✅ ${merged.standings.length}チームの結果を読み込みました`, 'success');
      document.getElementById('settingsCard').style.display = 'none';
    } else {
      showMsg('試合結果がまだありません。試合を記録すると表示されます。', 'info');
    }
  } catch (err) { showMsg('読み込み失敗：' + err.message, 'error'); }
}

function seededResult(seed) { let h = 2166136261; for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619); return Math.abs(h); }
function addStanding(table, team) { if (!table[team]) table[team] = { team, games:0, wins:0, losses:0, draws:0 }; }
function applyGameToStandings(table, g) {
  addStanding(table, g.teamA); addStanding(table, g.teamB);
  table[g.teamA].games++; table[g.teamB].games++;
  if (g.winner === g.teamA) { table[g.teamA].wins++; table[g.teamB].losses++; }
  else if (g.winner === g.teamB) { table[g.teamB].wins++; table[g.teamA].losses++; }
  else { table[g.teamA].draws++; table[g.teamB].draws++; }
}
function buildLeagueView(serverStandings, games) {
  const baseTeam = (document.getElementById('baseTeamInput')?.value || 'WII').trim() || 'WII';
  const simTeams = (document.getElementById('simTeamsInput')?.value || '').split(',').map(s => s.trim()).filter(Boolean).filter(t => t !== baseTeam);
  const baseStanding = serverStandings.find(t => t.team === baseTeam);
  const baseGames = baseStanding ? Number(baseStanding.games) || 0 : games.filter(g => g.teamA === baseTeam || g.teamB === baseTeam).length;
  const table = {};
  serverStandings.forEach(t => table[t.team] = { team:t.team, games:Number(t.games)||0, wins:Number(t.wins)||0, losses:Number(t.losses)||0, draws:Number(t.draws)||0 });
  const simGames = [];
  for (const team of simTeams) {
    addStanding(table, team);
    while (table[team].games < baseGames) {
      const idx = table[team].games + 1;
      const n = seededResult(`${baseTeam}:${team}:${idx}`);
      let opp = simTeams[(simTeams.indexOf(team) + idx) % Math.max(1, simTeams.length)] || baseTeam;
      if (opp === team) opp = baseTeam;
      const scoreA = n % 7;
      const scoreB = Math.floor(n / 7) % 7;
      const winner = scoreA === scoreB ? '引き分け' : (scoreA > scoreB ? team : opp);
      const g = { date:new Date(Date.now() - idx * 86400000).toISOString(), teamA:team, scoreA, teamB:opp, scoreB, winner, auto:true, detail:null };
      applyGameToStandings(table, g);
      simGames.push(g);
    }
  }
  const standings = Object.values(table).map(t => {
    const decided = t.wins + t.losses;
    return { ...t, pct: decided > 0 ? (t.wins / decided).toFixed(3) : '0.000' };
  }).sort((a,b) => (b.pct - a.pct) || (b.wins - a.wins) || a.team.localeCompare(b.team, 'ja'));
  return { standings, games:[...games, ...simGames].sort((a,b) => new Date(b.date) - new Date(a.date)) };
}

function renderStandings(standings) {
  const table = document.getElementById('standingsTable');
  const body = document.getElementById('standingsBody');
  const empty = document.getElementById('standingsEmpty');
  if (!standings.length) { table.style.display = 'none'; empty.style.display = 'block'; return; }
  table.style.display = 'table'; empty.style.display = 'none';
  body.innerHTML = standings.map((t, i) => {
    const rankClass = i === 0 ? 'rank-badge first' : 'rank-badge';
    const pctDisplay = (Number(t.wins) + Number(t.losses)) > 0 ? String(t.pct).replace(/^0/, '') : '---';
    return `<tr><td><span class="${rankClass}">${i + 1}</span></td><td class="team-col">${escapeHtml(t.team)}</td><td>${t.games}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.draws}</td><td class="pct-col">${pctDisplay}</td></tr>`;
  }).join('');
}
function renderGames(games) {
  const wrap = document.getElementById('gamesLog');
  const empty = document.getElementById('gamesEmpty');
  if (!games.length) { wrap.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  wrap.innerHTML = games.slice(0, 30).map((g, index) => {
    const d = g.date ? new Date(g.date) : null;
    const dateStr = d && !isNaN(d) ? `${d.getMonth() + 1}/${d.getDate()}` : '';
    return `<div class="game-row${g.auto ? ' auto' : ''}" onclick="showGameDetail(${index})"><div class="g-teams"><b>${escapeHtml(g.teamA)}</b> ${g.scoreA} - ${g.scoreB} <b>${escapeHtml(g.teamB)}</b></div><div class="g-date">${dateStr}</div></div>`;
  }).join('');
}
function showGameDetail(index) {
  const g = currentGames[index];
  const panel = document.getElementById('detailPanel');
  const body = document.getElementById('detailBody');
  if (!g) return;
  panel.classList.add('open');
  if (g.auto || !g.detail) {
    body.innerHTML = `<div class="detail-score"><div class="detail-team">${escapeHtml(g.teamA)}</div><div class="detail-vs">${g.scoreA} - ${g.scoreB}</div><div class="detail-team" style="text-align:right;">${escapeHtml(g.teamB)}</div></div><div class="empty-note">この試合は順位表用の自動追加なので詳細はありません。</div>`;
    panel.scrollIntoView({ behavior:'smooth', block:'start' }); return;
  }
  const d = g.detail;
  const teams = d.teams || [];
  const innings = Math.max(0, ...teams.map(t => (t.scores || []).length));
  const head = Array.from({length:innings}, (_,i)=>`<th>${i+1}</th>`).join('');
  const scoreRows = teams.map(t => `<tr><td>${escapeHtml(t.name)}</td>${(t.scores || []).map(v => `<td>${v || 0}</td>`).join('')}<td><b>${t.total || 0}</b></td></tr>`).join('');
  const batRows = teams.flatMap(t => (t.players || []).map(p => `<tr><td>${escapeHtml(p.name)}<br><span style="color:var(--white-muted);font-size:10px;">${escapeHtml(t.name)}</span></td><td>${p.pa||0}</td><td>${p.hits||0}</td><td>${p.hrs||0}</td><td>${p.rbi||0}</td><td>${p.walks||0}</td><td>${p.ks||0}</td></tr>`)).join('');
  const logs = (d.log || []).slice(0, 30).map(entry => `<div>${escapeHtml(typeof entry === 'object' ? entry.text : entry)}</div>`).join('');
  body.innerHTML = `<div class="detail-score"><div><div class="detail-team">${escapeHtml(g.teamA)}</div><div class="detail-total">${g.scoreA}</div></div><div class="detail-vs">VS</div><div style="text-align:right;"><div class="detail-team">${escapeHtml(g.teamB)}</div><div class="detail-total">${g.scoreB}</div></div></div><table class="mini-table"><thead><tr><th>TEAM</th>${head}<th>計</th></tr></thead><tbody>${scoreRows}</tbody></table><table class="mini-table"><thead><tr><th>選手</th><th>PA</th><th>H</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>${batRows}</tbody></table><div class="detail-log">${logs || '<div>ログはありません</div>'}</div>`;
  panel.scrollIntoView({ behavior:'smooth', block:'start' });
}
</script>
</body>
</html>
