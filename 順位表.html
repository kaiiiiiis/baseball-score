<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>チーム成績</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');
:root{--bg:#f4f1e8;--card:#fffdf6;--ink:#19231f;--muted:#56625c;--sub:#899189;--line:#d8cfbd;--green:#146c43;--green2:#0f5132;--gold:#d8a22d;--red:#b33a2f;--shadow:0 10px 24px rgba(39,32,22,.10);--r:10px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;letter-spacing:0!important}body{font-family:'Zen Kaku Gothic New','Noto Sans JP',sans-serif;background:linear-gradient(90deg,rgba(20,108,67,.045) 1px,transparent 1px),linear-gradient(0deg,rgba(20,108,67,.045) 1px,transparent 1px),var(--bg);background-size:28px 28px;color:var(--ink);min-height:100dvh}.app-header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:14px 16px;background:#123d2c;color:#fffdf6;border-bottom:4px solid var(--gold);box-shadow:0 8px 22px rgba(18,61,44,.18)}.app-header h1{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;text-transform:uppercase}.app-header h1:before{content:'● ';color:var(--gold);font-size:10px}.gear{position:absolute;right:14px;background:none;border:0;color:#fffdf6;font-size:18px;cursor:pointer}.wrap{max-width:920px;margin:0 auto;padding:18px 14px 48px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.card-title{font-family:'Oswald',sans-serif;color:var(--green2);font-size:13px;font-weight:700;text-transform:uppercase;border-bottom:2px solid var(--line);padding-bottom:10px;margin-bottom:14px}.form-label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}.form-input,.form-select{width:100%;padding:11px 12px;background:#fffaf0;border:1px solid #cfc3ad;border-radius:8px;color:var(--ink);font-size:14px;margin-bottom:10px}.btn{width:100%;padding:12px 18px;border:1px solid var(--green2);border-radius:8px;background:var(--green);color:#fffdf6;font-weight:800;cursor:pointer;box-shadow:0 6px 14px rgba(20,108,67,.2)}.msg{font-size:12px;padding:9px 12px;border-radius:8px;margin-top:10px;display:none}.msg.info,.msg.success{display:block;background:#e7f0e5;color:var(--green2)}.msg.error{display:block;background:#f7e8e5;color:var(--red)}.team-grid{display:grid;grid-template-columns:1fr;gap:12px}.team-card{border:1px solid var(--line);border-radius:var(--r);background:#fffdf6;padding:14px;box-shadow:var(--shadow)}.team-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.team-name{font-size:20px;font-weight:900}.record{font-family:'Oswald',sans-serif;font-size:18px;color:var(--green)}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#fffaf0;border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}.metric .v{font-family:'Oswald',sans-serif;font-size:23px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}.metric .l{font-size:10px;color:var(--sub);margin-top:2px}.team-actions{margin-top:12px;display:flex;gap:8px}.small-btn{flex:1;border:1px solid #cfc3ad;border-radius:8px;background:#fffaf0;color:var(--green2);font-weight:800;padding:9px;cursor:pointer}.section-tabs{display:flex;gap:6px;margin-bottom:10px}.tab{flex:1;border:1px solid #cfc3ad;border-radius:8px;background:#fffaf0;color:var(--green2);font-weight:800;padding:10px;cursor:pointer}.tab.active{background:var(--green);color:#fffdf6;border-color:var(--green2)}.rank-list{display:flex;flex-direction:column;gap:6px}.rank-row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fffdf6}.rank-no{font-family:'Oswald',sans-serif;color:var(--sub);font-weight:700}.rank-name{font-weight:800}.rank-sub{font-size:11px;color:var(--sub);margin-top:2px}.rank-val{font-family:'Oswald',sans-serif;font-size:18px;color:var(--green);font-weight:700}.empty{color:var(--sub);text-align:center;padding:24px 8px}.games-log{display:flex;flex-direction:column;gap:6px}.game-row{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fffdf6;font-size:12px}.game-row b{color:var(--ink)}.date{font-family:'Oswald',sans-serif;color:var(--sub)}@media(min-width:760px){.team-grid{grid-template-columns:1fr 1fr}.metric-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app-header"><h1>TEAM STATS</h1><button class="gear" onclick="toggleSettings()">⚙</button></div>
<div class="wrap">
  <div class="card" id="settingsCard" style="display:none;">
    <div class="card-title">スプレッドシート連携</div>
    <label class="form-label">Google Apps Script のURL</label>
    <input class="form-input" id="urlInput" placeholder="https://script.google.com/macros/s/..." />
    <button class="btn" onclick="loadData()">読み込む</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="card-title">チーム成績</div>
    <div id="teamGrid" class="team-grid"></div>
  </div>

  <div class="card" id="rankingCard" style="display:none;">
    <div class="card-title" id="rankingTitle">チーム内ランキング</div>
    <div class="section-tabs">
      <button class="tab active" id="tabHit" onclick="setRankingMode('hit')">打撃</button>
      <button class="tab" id="tabPitch" onclick="setRankingMode('pitch')">投手</button>
    </div>
    <select class="form-select" id="rankingSort" onchange="renderRankings()"></select>
    <div id="rankingList" class="rank-list"></div>
  </div>

  <div class="card">
    <div class="card-title">最近の試合</div>
    <div id="gamesLog" class="games-log"></div>
  </div>
</div>
<script>
let teamData=[];let gameData=[];let selectedTeam='';let rankingMode='hit';
const hitSorts=[['avg','打率'],['obp','出塁率'],['hits','安打'],['hrs','本塁打'],['rbi','打点'],['pa','打席']];
const pitchSorts=[['era','防御率'],['ip','投球回'],['ks','奪三振'],['runsAsc','失点 少ない順']];
function getUrl(){return localStorage.getItem('gasUrl')||''}function saveUrl(u){if(u)localStorage.setItem('gasUrl',u)}function toggleSettings(){const el=document.getElementById('settingsCard');el.style.display=el.style.display==='none'?'block':'none'}function showMsg(t,type){const el=document.getElementById('msg');if(!t){el.className='msg';el.textContent='';return}el.className='msg '+type;el.textContent=t}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function n(v){const x=Number(v);return Number.isFinite(x)?x:0}function avg(h,ab){return n(ab)?'.'+String(Math.round(n(h)/n(ab)*1000)).padStart(3,'0'):'.000'}
window.addEventListener('load',()=>{document.getElementById('urlInput').value=getUrl();if(getUrl())loadData();else toggleSettings();fillSort()});
async function loadData(){const url=document.getElementById('urlInput').value.trim();if(!url){showMsg('URLを入力してください','error');return}saveUrl(url);showMsg('読み込み中...','info');try{const res=await fetch(`${url}?action=teamStats`);const json=await res.json();if(json.status!=='ok'){showMsg('読み込み失敗：'+(json.message||'エラー'),'error');return}teamData=json.teams||[];gameData=json.games||[];renderTeams();renderGames();showMsg(`✅ ${teamData.length}チームを読み込みました`,'success');document.getElementById('settingsCard').style.display='none'}catch(err){showMsg('読み込み失敗：'+err.message,'error')}}
function renderTeams(){const wrap=document.getElementById('teamGrid');if(!teamData.length){wrap.innerHTML='<div class="empty">チーム成績がありません</div>';return}wrap.innerHTML=teamData.map(t=>`<div class="team-card"><div class="team-head"><div class="team-name">${esc(t.team)}</div><div class="record">${t.wins}-${t.losses}-${t.draws}</div></div><div class="metric-grid"><div class="metric"><div class="v">${t.games}</div><div class="l">試合</div></div><div class="metric"><div class="v">${String(t.pct).replace(/^0/,'')}</div><div class="l">勝率</div></div><div class="metric"><div class="v">${String(t.avg).replace(/^0/,'')}</div><div class="l">打率</div></div><div class="metric"><div class="v">${t.hits}</div><div class="l">安打</div></div><div class="metric"><div class="v">${t.hrs}</div><div class="l">本塁打</div></div><div class="metric"><div class="v">${t.rbi}</div><div class="l">打点</div></div><div class="metric"><div class="v">${t.era}</div><div class="l">防御率</div></div><div class="metric"><div class="v">${t.runsAllowed}</div><div class="l">失点</div></div></div><div class="team-actions"><button class="small-btn" onclick="openRankings('${encodeURIComponent(t.team)}')">チーム内ランキング</button></div></div>`).join('')}
function fillSort(){const list=rankingMode==='hit'?hitSorts:pitchSorts;document.getElementById('rankingSort').innerHTML=list.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
function setRankingMode(mode){rankingMode=mode;document.getElementById('tabHit').classList.toggle('active',mode==='hit');document.getElementById('tabPitch').classList.toggle('active',mode==='pitch');fillSort();renderRankings()}
function openRankings(team){selectedTeam=decodeURIComponent(team);document.getElementById('rankingCard').style.display='block';document.getElementById('rankingTitle').textContent=`${selectedTeam} チーム内ランキング`;rankingMode='hit';document.getElementById('tabHit').classList.add('active');document.getElementById('tabPitch').classList.remove('active');fillSort();renderRankings();document.getElementById('rankingCard').scrollIntoView({behavior:'smooth',block:'start'})}
function valueOfPlayer(p,key){if(key==='avg')return n(p.ab)?n(p.hits)/n(p.ab):-1;if(key==='obp')return n(p.pa)?(n(p.hits)+n(p.walks))/n(p.pa):-1;return n(p[key])}function valueOfPitcher(p,key){if(key==='era')return n(p.ip)?-Number(p.era):-999;if(key==='runsAsc')return -n(p.runs);return n(p[key])}
function renderRankings(){const team=teamData.find(t=>t.team===selectedTeam);const wrap=document.getElementById('rankingList');if(!team){wrap.innerHTML='';return}const key=document.getElementById('rankingSort').value;if(rankingMode==='hit'){const players=[...(team.players||[])].sort((a,b)=>valueOfPlayer(b,key)-valueOfPlayer(a,key));if(!players.length){wrap.innerHTML='<div class="empty">打者成績がありません</div>';return}wrap.innerHTML=players.slice(0,10).map((p,i)=>{const v=key==='avg'?avg(p.hits,p.ab):key==='obp'?avg(n(p.hits)+n(p.walks),p.pa):n(p[key]);return `<div class="rank-row"><div class="rank-no">${i+1}</div><div><div class="rank-name">${esc(p.name)}</div><div class="rank-sub">${n(p.pa)}打席 / ${n(p.hits)}安打 / ${n(p.hrs)}HR</div></div><div class="rank-val">${v}</div></div>`}).join('')}else{const pitchers=[...(team.pitchers||[])].sort((a,b)=>valueOfPitcher(b,key)-valueOfPitcher(a,key));if(!pitchers.length){wrap.innerHTML='<div class="empty">投手成績がありません</div>';return}wrap.innerHTML=pitchers.slice(0,10).map((p,i)=>{const v=key==='era'?p.era:key==='runsAsc'?n(p.runs):n(p[key]);return `<div class="rank-row"><div class="rank-no">${i+1}</div><div><div class="rank-name">${esc(p.name)}</div><div class="rank-sub">${n(p.ip)}回 / ${n(p.ks)}K / ${n(p.runs)}失点</div></div><div class="rank-val">${v}</div></div>`}).join('')}}
function renderGames(){const wrap=document.getElementById('gamesLog');if(!gameData.length){wrap.innerHTML='<div class="empty">試合結果がありません</div>';return}wrap.innerHTML=gameData.slice(0,20).map(g=>{const d=g.date?new Date(g.date):null;const ds=d&&!isNaN(d)?`${d.getMonth()+1}/${d.getDate()}`:'';return `<div class="game-row"><div><b>${esc(g.teamA)}</b> ${g.scoreA} - ${g.scoreB} <b>${esc(g.teamB)}</b></div><div class="date">${ds}</div></div>`}).join('')}
</script>
</body>
</html>
